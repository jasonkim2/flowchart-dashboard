<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>김재영 업무 상황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --sunk:#EAEEF2; --line:#D7DDE4; --line-soft:#E6EAEF;
  --ink:#16212E; --ink-2:#465465; --ink-3:#7A8796;
  --accent:#1E4E79; --accent-soft:#E2EBF4; --on-accent:#FFFFFF;
  --s-new:#6B7787; --s-new-bg:#ECEFF3;
  --s-prog:#1F63B5; --s-prog-bg:#E1ECF9;
  --s-wait:#A5620B; --s-wait-bg:#FBEFD9;
  --s-done:#23794A; --s-done-bg:#E0F2E7;
  --s-hold:#8A8F96; --s-hold-bg:#EEEFF1;
  --crit:#C2362F; --crit-bg:#FBE4E2;
  --work:#DFE5EC; --work-dow:#CFD7E1; --grid:#C3CCD7;
  --shadow:0 8px 28px rgba(22,33,46,.14);
  --sans:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#172029; --sunk:#1D2833; --line:#2B3845; --line-soft:#23303B;
  --ink:#E7ECF1; --ink-2:#AAB6C2; --ink-3:#7D8A97;
  --accent:#7FB0E0; --accent-soft:#1D3247; --on-accent:#0F151C;
  --s-new:#A7B2BF; --s-new-bg:#253039;
  --s-prog:#7DB3F0; --s-prog-bg:#1B3350;
  --s-wait:#E6AE5C; --s-wait-bg:#3A2C15;
  --s-done:#6CCB93; --s-done-bg:#173427;
  --s-hold:#9AA1A9; --s-hold-bg:#262C32;
  --crit:#F0807A; --crit-bg:#3D1E1D;
  --work:#24313D; --work-dow:#2D3B49; --grid:#34424F;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#172029; --sunk:#1D2833; --line:#2B3845; --line-soft:#23303B;
  --ink:#E7ECF1; --ink-2:#AAB6C2; --ink-3:#7D8A97;
  --accent:#7FB0E0; --accent-soft:#1D3247; --on-accent:#0F151C;
  --s-new:#A7B2BF; --s-new-bg:#253039;
  --s-prog:#7DB3F0; --s-prog-bg:#1B3350;
  --s-wait:#E6AE5C; --s-wait-bg:#3A2C15;
  --s-done:#6CCB93; --s-done-bg:#173427;
  --s-hold:#9AA1A9; --s-hold-bg:#262C32;
  --crit:#F0807A; --crit-bg:#3D1E1D;
  --work:#24313D; --work-dow:#2D3B49; --grid:#34424F;
  --shadow:0 8px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.top .sub{color:var(--ink-3);font-size:13px;margin-top:2px}
.top .ttl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .ttl .conn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px}
.top .actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.danger{color:var(--crit);border-color:var(--crit-bg)}
.btn.danger.armed{background:var(--crit);color:#fff;border-color:var(--crit)}
.conn{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.conn.ok i{background:var(--s-done)}

/* overview */
.overview{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.p-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p-head h2{margin:0;font-size:15px;font-weight:700}
.p-head .num{font-size:13px;color:var(--ink-2)}
.olist{display:flex;flex-direction:column;max-height:360px;overflow-y:auto;margin-inline:-16px}
.orow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 16px;border-top:1px solid var(--line-soft)}
.orow:hover{background:var(--sunk)}
.orow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.orow .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .t small{color:var(--ink-3);font-weight:400;margin-left:6px;font-size:12px}
.orow .dd{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.orow .dd.over{color:var(--crit);font-weight:600}
.orow .pill{justify-self:start}
.orow.ohead{cursor:default;background:var(--sunk);font-size:12px;font-weight:600;color:var(--ink-2);padding-block:6px;position:sticky;top:0;z-index:1;border-top:0}
.orow.ohead:hover{background:var(--sunk)}
.orow.ohead span:last-child{text-align:right}
.orow .dd{text-align:right}
.imp .idx{background:var(--crit);color:#fff}
.imp .t,.imp b{color:var(--crit)}
.imp .t{font-weight:700}
.notes{list-style:none;margin:0 -16px;padding:0;display:flex;flex-direction:column;max-height:360px;overflow-y:auto}
.notes li{border-top:1px solid var(--line-soft)}
.note-b{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:9px 16px;width:100%}
.note-b:hover{background:var(--sunk)}
.note-b:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.note-b .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.note-b b{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-b p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.note-b .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.idx{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);width:24px;height:24px;border-radius:6px;background:var(--accent-soft);display:inline-flex;align-items:center;justify-content:center}

/* tabs */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-weight:500;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px}
.legend .wk i{width:14px;height:10px;background:var(--work);border:1px solid var(--line)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st-접수{color:var(--s-new);background:var(--s-new-bg)}
.st-진행{color:var(--s-prog);background:var(--s-prog-bg)}
.st-보고대기{color:var(--s-wait);background:var(--s-wait-bg)}
.st-완료{color:var(--s-done);background:var(--s-done-bg)}
.st-보류{color:var(--s-hold);background:var(--s-hold-bg)}
.pill.over{color:var(--crit);background:var(--crit-bg)}
.size{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.size.중대{color:var(--accent);border-color:var(--accent)}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 14px 16px;border-bottom:1px solid var(--line);position:relative}
.cal-head .side{display:flex}
.cal-head .side.r{justify-content:flex-end}
.cal-head .side{align-self:stretch}
.mbtn{display:inline-flex;align-items:center;justify-content:center;gap:0;width:88px;height:76px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 22px;color:var(--ink-2);font-size:27px;font-weight:700;letter-spacing:-.01em;line-height:1}
.mbtn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.mbtn:active{transform:translateY(1px)}
.mbtn .ar{width:36px;height:36px;flex:none;display:block;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mbtn span{display:block;line-height:1}
.cal-head .mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.cal-head .yr{font-family:var(--mono);font-size:13px;color:var(--ink-3);letter-spacing:.08em}
.cal-head h2{margin:0;font-size:40px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.todayBtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 12px;font-size:12px;color:var(--ink-2);margin-top:6px}
.todayBtn[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-size:12px;color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);border-right:1px solid var(--grid);background:var(--sunk)}
.dow.sun{color:var(--crit)}
.day{min-height:112px;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--surface);text-align:left;border-top:0;border-left:0;min-width:0}
.day:nth-child(7n),.dow:nth-child(7n){border-right:0}
.day.work{background:var(--work)}
.dow.work{background:var(--work-dow);color:var(--ink);font-weight:600}
.day.out>*{opacity:.45}
.day.out{color:var(--ink-3)}
.day .dn{font-family:var(--mono);font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center}
.day.today .dn b{background:var(--accent);color:var(--on-accent);border-radius:4px;padding:0 5px}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.chip{display:block;width:100%;font-size:12px;line-height:1.35;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;text-align:left;font-weight:500}
.chip.over{box-shadow:inset 3px 0 0 var(--crit)}
.lg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:flex-start;gap:5px;width:100%;padding:3px 4px;border-radius:4px;min-width:0}
.lg:hover{background:var(--surface)}
.lg:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.lg .lt{display:flex;flex-direction:column;gap:1px;min-width:0}
.lg .lt b{font-size:12px;font-weight:600;color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .lt em{font-style:normal;font-size:11px;color:var(--ink-2);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .lb{margin-top:1px}
.lb{flex:none;font-family:var(--mono);font-size:10px;font-weight:600;width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.lb.imp-b{background:var(--crit);color:#fff}
.dsec{display:flex;flex-direction:column;gap:6px}
.dsec h4{margin:0;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.dlog{list-style:none;margin:0;padding:0;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
.dlog li+li{border-top:1px solid var(--line-soft)}
.dlog .note-b p{white-space:normal}
.more{font-size:11px;color:var(--ink-3);padding-left:4px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%}

.daylist{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.daylist h3{margin:0;font-size:14px;font-weight:600}
.daylist .empty{color:var(--ink-3);font-size:13px}

/* list rows */
.rows{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:54px minmax(0,1fr) 110px 150px 96px;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row.head{cursor:default;font-size:12px;color:var(--ink-3);background:var(--sunk);padding-block:7px}
.row.head:hover{background:var(--sunk)}
.row .no{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.row .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .tt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tt small{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .due{font-family:var(--mono);font-size:12px}
.row .due.over{color:var(--crit);font-weight:600}
.prog{display:flex;align-items:center;gap:8px}
.prog .track{flex:1;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.prog .fill{height:100%;background:var(--accent)}
.prog .pct{font-family:var(--mono);font-size:11px;color:var(--ink-2);width:30px;text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
.seg{display:inline-flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.blank{padding:28px;text-align:center;color:var(--ink-3)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font-size:16px;font-weight:600}
.x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--ink-3);padding:2px 6px}
.dr-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.dr-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dr-foot .r{display:flex;gap:8px}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.sec h3{margin:0 0 6px;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.04em}
.sec p{margin:0;white-space:pre-wrap}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line);padding-left:12px}
.log li{font-size:13px}
.log .ld{font-family:var(--mono);font-size:11px;color:var(--ink-3);display:block}
.fb{background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.form input,.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;font-size:14px;width:100%}
.form textarea{min-height:76px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.addlog{display:flex;gap:8px}
.addlog input{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 10px;min-width:0}
.note{font-size:12px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:30}

@media (max-width:760px){
  .wrap{padding-inline:16px}
  .overview{grid-template-columns:1fr}
  .day{min-height:58px;padding:4px}
  .cal-head h2{font-size:30px}
  .mbtn{width:56px;height:56px;padding:0}
  .mbtn .ar{width:26px;height:26px}
  .day .chip,.day .more,.day .lg{display:none}
  .day .dots{display:flex}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .row.head{display:none}
  .row .no{display:none}
  .row .tt{grid-column:1 / -1}
  .row .prog{grid-column:1 / -1}
  .orow{grid-template-columns:28px minmax(0,1fr)}
  .orow .dd{grid-column:2;text-align:left}
  .orow.ohead span:last-child{display:none}
  .form .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div class="ttl">
      <h1>김재영 업무 상황판</h1>
      <span class="conn" id="conn"><i></i><span>연결 중</span></span>
    </div>
    <div class="actions">
      <button class="btn primary" id="addBtn" hidden>+ 지시 등록</button>
    </div>
  </header>

  <div class="overview">
    <section class="panel">
      <div class="p-head"><h2>진행 업무</h2><span class="num" id="openCount">0건</span></div>
      <div id="openList" class="olist"></div>
    </section>
    <section class="panel">
      <div class="p-head"><h2>진행 사항</h2><span class="note" id="avgProg"></span></div>
            <ol class="notes" id="notes"></ol>
    </section>
  </div>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabCal" aria-selected="true">달력</button>
      <button role="tab" id="tabList" aria-selected="false">목록</button>
    </div>

  </div>

  <section id="calView">
    <div class="cal">
      <div class="cal-head">
        <div class="side"><button class="mbtn" id="prevM" aria-label="이전 달"><svg class="ar" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button></div>
        <div class="mid">
          <span class="yr" id="calYear"></span>
          <h2 id="calTitle"></h2>
          <button class="todayBtn" id="thisM" hidden>이번 달로</button>
        </div>
        <div class="side r"><button class="mbtn" id="nextM" aria-label="다음 달"><svg class="ar" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
      </div>
      <div class="grid" id="dowRow"></div>
      <div class="grid" id="calGrid"></div>
    </div>
    <div class="daylist" id="dayList" style="margin-top:12px"></div>
  </section>

  <section id="listView" hidden>

  $("calYear").textContent=calY;$("calTitle").textContent=`${calM+1}월`;
  const pm=calM===0?12:calM, nm=calM===11?1:calM+2;
  const pl=(calM===0?`${calY-1}년 `:"")+pm+"월", nl=(calM===11?`${calY+1}년 `:"")+nm+"월";
  $("prevM").setAttribute("aria-label",`이전 달 (${pl})`);$("prevM").title=pl;
  $("nextM").setAttribute("aria-label",`다음 달 (${nl})`);$("nextM").title=nl;
  $("thisM").hidden=(calY===now.getFullYear()&&calM===now.getMonth());
  const first=new Date(calY,calM,1), start=new Date(first); start.setDate(1-first.getDay());
  const last=new Date(calY,calM+1,0); const cells=Math.ceil((first.getDay()+last.getDate())/7)*7;
  const byDay={}, logDay={};
  items.forEach(x=>{
    if(x.dueDate)(byDay[x.dueDate]=byDay[x.dueDate]||[]).push(x);
    (x.log||[]).forEach(l=>{ if(l.t==="지시 등록")return; (logDay[l.d]=logDay[l.d]||[]).push({x,l}); });
  });
  const badge=x=>`<span class="lb${isImp(x)?" imp-b":""}">${ORDER[x.id]||"·"}</span>`;
  let h="";
  for(let i=0;i<cells;i++){
    const d=new Date(start); d.setDate(start.getDate()+i); const k=ymd(d);
    const list=(byDay[k]||[]).sort(sortFn);
    const logs=(logDay[k]||[]).sort((a,b)=>(ORDER[a.x.id]||99)-(ORDER[b.x.id]||99));
    const MAX=4;
    const dueHtml=list.map(x=>`<button class="chip st-${esc(x.status)}${isOver(x)?" over":""}" data-id="${esc(x.id)}" title="마감: ${esc(x.title)}">마감 · ${esc(x.title)}</button>`);
    const logHtml=logs.map(({x,l})=>`<button class="lg" data-id="${esc(x.id)}" title="${esc(x.title)} — ${esc(l.t)}">${badge(x)}<span class="lt"><b>${esc(x.title)}</b><em>${esc(l.t)}</em></span></button>`);
    const all=[...dueHtml,...logHtml];
    const cls=["day",d.getDay()>=1&&d.getDay()<=4?"work":"",d.getMonth()!==calM?"out":"",k===TODAY?"today":"",k===selDay?"sel":""].join(" ");
    h+=`<div class="${cls}" data-day="${k}" role="button" tabindex="0" aria-label="${k} 마감 ${list.length}건, 진행 ${logs.length}건">
      <span class="dn"><b>${d.getDate()}</b></span>
      ${all.slice(0,MAX).join("")}
      ${all.length>MAX?`<span class="more">+${all.length-MAX}건</span>`:""}
      <span class="dots">${list.slice(0,4).map(x=>`<i style="background:var(${isOver(x)?"--crit":COLORS[x.status]})"></i>`).join("")}${logs.slice(0,4).map(()=>`<i style="background:var(--ink-3)"></i>`).join("")}</span>
    </div>`;
  }
  $("calGrid").innerHTML=h;
  renderDayList();
}
function renderDayList(){
  const list=items.filter(x=>x.dueDate===selDay).sort(sortFn);
  const logs=[];items.forEach(x=>(x.log||[]).forEach(l=>{if(l.d===selDay&&l.t!=="지시 등록")logs.push({x,l})}));
  logs.sort((a,b)=>(ORDER[a.x.id]||99)-(ORDER[b.x.id]||99));
  let h=`<h3>${esc(fmtFull(selDay))}</h3>`;
  h+=`<div class="dsec"><h4>진행 기록 · ${logs.length}건</h4>`+(logs.length?`<ul class="dlog">${logs.map(({x,l})=>`<li><button class="note-b${isImp(x)?" imp":""}" data-id="${esc(x.id)}"><span class="idx">${ORDER[x.id]||"·"}</span><span class="tx"><b>${esc(x.title)}</b><p>${esc(l.t)}</p></span></button></li>`).join("")}</ul>`:`<div class="empty">이 날 진행 기록이 없습니다.</div>`)+`</div>`;
  h+=`<div class="dsec"><h4>마감 · ${list.length}건</h4>`+(list.length?`<div class="rows">${list.map(rowHtml).join("")}</div>`:`<div class="empty">이 날 마감인 업무가 없습니다.</div>`)+`</div>`;
  $("dayList").innerHTML=h;
}

/* ---------- list ---------- */
function sortFn(a,b){
  const rank=x=>isOver(x)?0:OPEN.has(x.status)?1:x.status==="보류"?2:3;
  if(rank(a)!==rank(b))return rank(a)-rank(b);
  return (a.dueDate||"9999").localeCompare(b.dueDate||"9999")||(a.no||0)-(b.no||0);
}
function rowHtml(x){
  const p=autoProg(x);
  return `<button class="row" data-id="${esc(x.id)}">
    <span class="no">${noLabel(x.no)}</span>
    <span class="tt"><b>${esc(x.title)}</b><small>${esc([x.owner!==ME?x.owner:"",x.source,x.size].filter(Boolean).join(" · "))}</small></span>
    <span>${statusPill(x)}</span>
    <span class="due${isOver(x)?" over":""}">${esc(dueText(x))}</span>
    <span class="prog"><span class="track"><span class="fill" style="width:${p}%"></span></span><span class="pct">${p}%</span></span>
  </button>`;
}
function renderList(){
  let list=items.slice();
  if(listFilter==="open")list=list.filter(x=>OPEN.has(x.status));
  if(listFilter==="done")list=list.filter(x=>x.status==="완료");
  if(listFilter==="hold")list=list.filter(x=>x.status==="보류");
  if(query){const q=query.toLowerCase();list=list.filter(x=>(x.title+" "+(x.owner||"")+" "+(x.detail||"")).toLowerCase().includes(q))}
  list.sort(sortFn);
  $("rows").innerHTML=`<div class="row head"><span>번호</span><span>지시 내용</span><span>상태</span><span>기한</span><span>진행률</span></div>`+
    (list.length?list.map(rowHtml).join(""):`<div class="blank">${db?"해당하는 지시가 없습니다.":"데이터를 불러오는 중입니다."}</div>`);
}

function renderAll(){renderStats();renderCal();renderList()}

/* ---------- drawer ---------- */
let current=null, delArmed=false;
function openDrawer(html){$("drawer").innerHTML=html;$("drawer").hidden=false;$("scrim").hidden=false;delArmed=false}
function closeDrawer(){$("drawer").hidden=true;$("scrim").hidden=true;current=null}
$("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("drawer").hidden)closeDrawer()});

function showDetail(id){
  const x=items.find(i=>i.id===id); if(!x)return; current=id;
  const log=(x.log||[]).slice().reverse();
  openDrawer(`
    <div class="dr-head"><h2><span class="num" style="color:var(--ink-3);font-size:13px">${noLabel(x.no)}</span>&nbsp; ${esc(x.title)}</h2><button class="x" data-act="close" aria-label="닫기">×</button></div>
    <div class="dr-body">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${statusPill(x)} <span class="size ${esc(x.size)}">${esc(x.size||"일반")}</span></div>
      <dl class="kv">
        <dt>지시일</dt><dd class="num">${esc(fmtFull(x.issuedAt))}</dd>
        <dt>기한</dt><dd class="num">${esc(fmtFull(x.dueDate))}${x.dueDate&&x.status!=="완료"?` · ${esc(dueText(x).split(" · ")[1])}`:""}</dd>
        <dt>담당</dt><dd>${esc(x.owner||"—")}</dd>
        <dt>경로</dt><dd>${esc(x.source||"—")}</dd>
        <dt>진행률</dt><dd><span class="prog" style="max-width:220px"><span class="track"><span class="fill" style="width:${autoProg(x)}%"></span></span><span class="pct">${autoProg(x)}%</span></span> <span class="note">지시일~기한 경과 기준</span></dd>
        ${x.doneAt?`<dt>완료일</dt><dd class="num">${esc(fmtFull(x.doneAt))}</dd>`:""}
      </dl>
      ${x.detail?`<div class="sec"><h3>지시 내용</h3><p>${esc(x.detail)}</p></div>`:""}
      ${x.feedback?`<div class="sec"><h3>대표 피드백</h3><p class="fb">${esc(x.feedback)}</p></div>`:""}
      <div class="sec"><h3>진행 이력</h3>
        ${log.length?`<ul class="log">${log.map(l=>`<li><span class="ld">${esc(l.d)}</span>${esc(l.t)}</li>`).join("")}</ul>`:`<p class="note">기록 없음</p>`}
        ${canWrite?`<div class="addlog" style="margin-top:10px"><input id="logInput" placeholder="진행 내용 한 줄 기록"><button class="btn" data-act="addlog">기록</button></div>`:""}
      </div>
    </div>
    ${canWrite?`<div class="dr-foot"><button class="btn danger" data-act="del">삭제</button><div class="r"><button class="btn" data-act="edit">수정</button></div></div>`:""}
  `);
}

function showForm(x){
  const e=x||{status:"접수",size:"일반",source:"오전회의",issuedAt:TODAY,owner:ME};
  current=x?x.id:null;
  const opt=(arr,v)=>arr.map(a=>`<option${a===v?" selected":""}>${a}</option>`).join("");
  openDrawer(`
    <div class="dr-head"><h2>${x?"지시 수정":"지시 등록"}</h2><button class="x" data-act="close" aria-label="닫기">×</button></div>
    <div class="dr-body"><form class="form" id="f">
      <label>지시 제목<input id="fTitle" required value="${esc(e.title||"")}" placeholder="예: 일본 데이터 라이선스 비용 비교"></label>
      <label>지시 내용 (원문)<textarea id="fDetail" placeholder="대표님 지시를 원문 그대로 기록">${esc(e.detail||"")}</textarea></label>
      <div class="two">
        <label>지시일<input id="fIssued" type="date" value="${esc(e.issuedAt||"")}"></label>
        <label>기한<input id="fDue" type="date" value="${esc(e.dueDate||"")}"></label>
      </div>
      <div class="two">
        <label>상태<select id="fStatus">${opt(STATUSES,e.status)}</select></label>
        <label>담당<input id="fOwner" value="${esc(e.owner||"")}" placeholder="이름 / 팀"></label>
      </div>
      <div class="two">
        <label>규모<select id="fSize">${opt(SIZES,e.size)}</select></label>
        <label>지시 경로<select id="fSource">${opt(SOURCES,e.source)}</select></label>
      </div>
      <label>대표 피드백<textarea id="fFeedback" placeholder="보고 후 받은 코멘트">${esc(e.feedback||"")}</textarea></label>
    </form></div>
    <div class="dr-foot"><span class="note">완료로 바꾸면 완료일이 오늘로 기록됩니다.</span><div class="r"><button class="btn" data-act="${x?"back":"close"}">취소</button><button class="btn primary" data-act="save">저장</button></div></div>
  `);
  setTimeout(()=>$("fTitle").focus(),30);
}

$("drawer").addEventListener("click",async ev=>{
  const b=ev.target.closest("[data-act]"); if(!b)return;
  const act=b.dataset.act;
  if(act==="close")return closeDrawer();
  if(act==="back")return showDetail(current);
  if(act==="edit")return showForm(items.find(i=>i.id===current));
  if(act==="del"){
    if(!delArmed){delArmed=true;b.classList.add("armed");b.textContent="한 번 더 누르면 삭제";return}
    try{await col.doc(current).delete();closeDrawer();toast("삭제했습니다")}catch(e){toast("삭제하지 못했습니다: "+e.code)}
    return;
  }
  if(act==="addlog"){
    const t=$("logInput").value.trim(); if(!t)return;
    const x=items.find(i=>i.id===current);
    try{await col.doc(current).update({log:[...(x.log||[]),{d:TODAY,t}],updatedAt:new Date().toISOString()});toast("기록했습니다")}catch(e){toast("기록하지 못했습니다: "+e.code)}
    return;
  }
  if(act==="save"){
    const title=$("fTitle").value.trim(); if(!title){$("fTitle").focus();toast("제목을 입력하세요");return}
    const prev=current?items.find(i=>i.id===current):null;
    const status=$("fStatus").value;
    const data={
      title, detail:$("fDetail").value.trim(), issuedAt:$("fIssued").value, dueDate:$("fDue").value,
      status, owner:$("fOwner").value.trim(), size:$("fSize").value, source:$("fSource").value,
      feedback:$("fFeedback").value.trim(),
      updatedAt:new Date().toISOString()
    };
    if(status==="완료")data.doneAt=prev?.doneAt||TODAY; else data.doneAt="";
    b.disabled=true;
    try{
      if(prev){
        const log=[...(prev.log||[])]; if(prev.status!==status)log.push({d:TODAY,t:`상태 변경: ${prev.status} → ${status}`});
        await col.doc(prev.id).update({...data,log});
        showDetailSoon(prev.id);toast("저장했습니다");
      }else{
        const no=items.reduce((m,i)=>Math.max(m,Number(i.no)||0),0)+1;
        const ref=await col.add({...data,no,createdAt:new Date().toISOString(),log:[{d:TODAY,t:"지시 등록"}]});
        showDetailSoon(ref.id);toast("등록했습니다");
      }
    }catch(e){b.disabled=false;toast("저장하지 못했습니다: "+(e.code||e.message))}
  }
});
function showDetailSoon(id){current=id;const t=()=>items.find(i=>i.id===id)?showDetail(id):setTimeout(t,120);t()}

/* ---------- events ---------- */
document.addEventListener("click",ev=>{
  const idEl=ev.target.closest("[data-id]");
  if(idEl&&!ev.target.closest("#drawer")){ev.stopPropagation();showDetail(idEl.dataset.id);return}
  const dayEl=ev.target.closest("[data-day]");
  if(dayEl){selDay=dayEl.dataset.day;renderCal()}
});
$("calGrid").addEventListener("keydown",ev=>{const d=ev.target.closest("[data-day]");if(d&&(ev.key==="Enter"||ev.key===" ")&&ev.target===d){ev.preventDefault();selDay=d.dataset.day;renderCal()}});
$("prevM").onclick=()=>{calM--;if(calM<0){calM=11;calY--}renderCal()};
$("nextM").onclick=()=>{calM++;if(calM>11){calM=0;calY++}renderCal()};
$("thisM").onclick=()=>{calY=now.getFullYear();calM=now.getMonth();selDay=TODAY;renderCal()};
function setView(v){view=v;$("tabCal").setAttribute("aria-selected",v==="cal");$("tabList").setAttribute("aria-selected",v==="list");$("calView").hidden=v!=="cal";$("listView").hidden=v!=="list";try{localStorage.setItem("ceoBoardView",v)}catch(e){}}
$("tabCal").onclick=()=>setView("cal");$("tabList").onclick=()=>setView("list");
$("seg").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;listFilter=b.dataset.f;[...$("seg").children].forEach(c=>c.setAttribute("aria-pressed",c===b));renderList()};
$("q").oninput=ev=>{query=ev.target.value.trim();renderList()};
$("addBtn").onclick=()=>showForm(null);
try{const v=localStorage.getItem("ceoBoardView");if(v==="list")setView("list")}catch(e){}

renderAll();

/* ---------- data ---------- */
(async()=>{
  const conn=$("conn");
  if(window.__SNAPSHOT__){
    const S=window.__SNAPSHOT__; items=S.items; canWrite=false; db={};
    conn.classList.add("ok"); conn.querySelector("span").textContent="업데이트 "+S.at;
    renderAll(); return;
  }
  db=await window.claude?.use?.("db");
  if(!db){conn.querySelector("span").textContent="오프라인 보기";renderList();return}
  col=db.collection("directives");
  const user=await window.claude.use("user");
  const w=user?await user.can("data.write"):null;
  canWrite=w!==false;
  $("addBtn").hidden=!canWrite;
  if(!canWrite)conn.querySelector("span").textContent="열람 전용";
  col.onSnapshot(snap=>{
    items=snap.docs.map(d=>({id:d.id,...d.data()}));
    conn.classList.add("ok"); if(canWrite)conn.querySelector("span").textContent="실시간 동기화";
    renderAll();
    if(current&&!$("drawer").hidden&&!$("f"))showDetail(current);
  },e=>{conn.classList.remove("ok");conn.querySelector("span").textContent="연결 끊김"});
})();
</script>

</body>
</html>
