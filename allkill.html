<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE스코어 응원톡 - 업보트 데모</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif; }
  body { background:#111; display:flex; justify-content:center; min-height:100vh; }
  .phone { width:390px; background:#fff; display:flex; flex-direction:column; height:100vh; max-height:900px; overflow:hidden; position:relative; }

  /* ===== 상단: 중계판 (최소화) ===== */
  .broadcast { background:linear-gradient(180deg,#2d3436,#3d4547); color:#fff; padding:10px 16px; }
  .broadcast .top-line { display:flex; justify-content:center; align-items:center; gap:6px; font-size:11px; color:#9aa0a3; margin-bottom:4px; }
  .broadcast .score-line { display:flex; justify-content:space-between; align-items:center; }
  .bteam { display:flex; align-items:center; gap:7px; font-size:16px; font-weight:700; }
  .bteam .rk { font-size:11px; color:#9aa0a3; font-weight:400; }
  .bscore { font-size:22px; font-weight:800; letter-spacing:3px; }
  .live-dot { width:6px; height:6px; border-radius:50%; background:#ff4d4d; display:inline-block; animation:blink 1.2s infinite; }
  @keyframes blink { 50%{opacity:.2;} }

  /* ===== 응원 배틀 게이지 ===== */
  .battle { background:#fff; padding:10px 12px 6px; border-bottom:1px solid #eee; }
  .battle-head { display:flex; justify-content:center; align-items:center; gap:6px; font-size:11px; color:#999; margin-bottom:6px; }
  .battle-head b { color:#e74c3c; }
  .gauge-row { display:flex; align-items:center; gap:8px; }
  .g-flag { font-size:24px; flex-shrink:0; }
  .gauge { flex:1; display:flex; height:34px; border-radius:17px; overflow:hidden; }
  .gauge .gl { background:linear-gradient(90deg,#e8564a,#d43d30); color:#fff; display:flex; align-items:center; gap:6px; padding-left:14px; font-size:14px; font-weight:800; transition:width .6s cubic-bezier(.4,0,.2,1); min-width:95px; }
  .gauge .gr { background:linear-gradient(90deg,#5b6cc0,#33408f); color:#fff; display:flex; align-items:center; justify-content:flex-end; gap:6px; padding-right:14px; font-size:14px; font-weight:800; flex:1; min-width:95px; }
  .gauge-sub { display:flex; justify-content:space-between; font-size:10px; color:#aaa; margin-top:4px; padding:0 36px; }
  @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .pulse { animation:pulse .4s ease; }

  /* ===== 정렬 탭 ===== */
  .sort-bar { display:flex; align-items:center; gap:6px; background:#fff; padding:10px 14px 8px; border-bottom:1px solid #f0f0f0; }
  .sort-bar .label { font-size:14px; font-weight:800; color:#222; margin-right:6px; }
  .sort-tab { border:1px solid #e0e0e0; background:#fff; border-radius:14px; font-size:12px; color:#888; padding:5px 12px; cursor:pointer; font-weight:600; }
  .sort-tab.active { background:#2d3436; color:#fff; border-color:#2d3436; }

  /* ===== 응원글 피드 (메인) ===== */
  .feed { flex:1; overflow-y:auto; background:#fff; position:relative; padding-bottom:8px; }
  .comment { display:flex; gap:10px; padding:14px 12px; border-bottom:1px solid #f0f0f0; background:#fff; position:relative; transition:transform .5s cubic-bezier(.4,0,.2,1), background .3s; }
  .comment.best { background:#fffbea; border-left:4px solid #ffcc00; }
  .comment.moving { box-shadow:0 6px 18px rgba(0,0,0,.12); z-index:5; }

  /* 순위 표시 */
  .rank-col { width:30px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .rank-num { font-size:16px; font-weight:900; color:#bbb; }
  .rank-num.r1 { color:#f0a500; font-size:20px; }
  .rank-num.r2 { color:#9aa4ad; font-size:18px; }
  .rank-num.r3 { color:#b0793a; font-size:17px; }
  .rank-delta { font-size:10px; font-weight:800; }
  .rank-delta.up { color:#e74c3c; }
  .rank-delta.down { color:#4a6ee0; }
  .rank-delta.same { color:#ddd; }

  .avatar-c { width:46px; height:46px; border-radius:50%; border:2px solid #f2b8c0; background:#fdf0f2; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; color:#f2b8c0; align-self:flex-start; }
  .avatar-c.au { border-color:#b8c4f2; background:#f0f2fd; color:#b8c4f2; }

  .c-body { flex:1; min-width:0; }
  .c-meta { display:flex; align-items:center; gap:5px; font-size:13px; color:#888; flex-wrap:wrap; }
  .c-meta .flag { font-size:14px; }
  .c-meta .nick { color:#666; font-weight:600; }
  .c-meta .gen { color:#aaa; font-size:11px; }
  .karma { background:#f2f2f2; color:#999; font-size:10px; font-weight:700; padding:1px 6px; border-radius:8px; }
  .karma.lv2 { background:#e7defc; color:#6b4fb8; }
  .karma.lv3 { background:#ffedb8; color:#9a6b00; }
  .best-tag { background:#ffcc00; color:#5b4a00; font-size:10px; font-weight:800; padding:1px 7px; border-radius:8px; }
  .hot-tag { background:#ff3b30; color:#fff; font-size:9px; font-weight:800; padding:1px 5px; border-radius:5px; }
  .c-text { font-size:16px; color:#222; margin-top:4px; line-height:1.45; word-break:break-all; }
  .c-sub { font-size:11px; color:#bbb; margin-top:5px; display:flex; gap:8px; }
  .c-sub .u { color:#e74c3c; } .c-sub .d { color:#4a6ee0; }

  /* 업보트 버튼 — 명확한 버튼 형태 */
  .vote-col { display:flex; flex-direction:column; align-items:center; gap:4px; width:54px; flex-shrink:0; align-self:center; }
  .vote-btn { width:48px; height:36px; border:1.5px solid #ddd; background:#fafafa; border-radius:10px; cursor:pointer; font-size:19px; font-weight:800; color:#8e8e93; line-height:1; transition:all .12s; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; align-items:center; justify-content:center; }
  .vote-btn:active { transform:scale(.88); }
  .vote-btn.up:hover { border-color:#e74c3c; color:#e74c3c; }
  .vote-btn.down:hover { border-color:#4a6ee0; color:#4a6ee0; }
  .vote-btn.up.on { background:#e74c3c; border-color:#e74c3c; color:#fff; box-shadow:0 2px 8px rgba(231,76,60,.45); }
  .vote-btn.down.on { background:#4a6ee0; border-color:#4a6ee0; color:#fff; box-shadow:0 2px 8px rgba(74,110,224,.45); }
  .vote-score { font-size:17px; font-weight:900; color:#555; }
  .vote-score.pos { color:#e74c3c; }
  .vote-score.neg { color:#4a6ee0; }

  /* 입력 바 */
  .input-bar { background:#fff; border-top:1px solid #e5e5ea; padding:10px 12px; display:flex; gap:8px; align-items:center; }
  .team-pick { display:flex; gap:4px; }
  .team-pick button { width:36px; height:36px; border-radius:50%; border:2px solid transparent; background:#f2f2f7; font-size:17px; cursor:pointer; }
  .team-pick button.sel { border-color:#e74c3c; background:#fdeeed; }
  .team-pick button.sel.aus { border-color:#33408f; background:#eef0fb; }
  .input-bar input { flex:1; border:none; background:#f2f2f7; border-radius:18px; padding:10px 14px; font-size:14px; outline:none; }
  .send { border:none; background:#2d3436; color:#fff; border-radius:18px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; }

  /* 시뮬레이션 토글 (플로팅) */
  .sim { position:absolute; right:12px; bottom:76px; width:46px; height:46px; border-radius:50%; border:none; background:#5c6bc0; color:#fff; font-size:20px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.25); z-index:20; }
  .sim.off { background:#cfd8dc; }
</style>
</head>
<body>
<div class="phone">

  <!-- 중계판 (단순화) -->
  <div class="broadcast">
    <div class="top-line"><span class="live-dot"></span> LIVE 중계판 · 1회 초</div>
    <div class="score-line">
      <div class="bteam">🇹🇼 대만 <span class="rk">(6위)</span></div>
      <div class="bscore">0 : 0</div>
      <div class="bteam"><span class="rk">(12위)</span> 호주 🇦🇺</div>
    </div>
  </div>

  <!-- 응원 배틀 게이지 (업보트 합산 연동) -->
  <div class="battle">
    <div class="battle-head">⚔️ 응원 배틀 — <b>업보트</b>가 우리 팀 응원 점수가 됩니다</div>
    <div class="gauge-row">
      <span class="g-flag">🇹🇼</span>
      <div class="gauge">
        <div class="gl" id="barL"><span id="crownL">👑</span><span id="numL">5,618</span></div>
        <div class="gr"><span id="numR">3,207</span><span id="crownR" style="display:none;">👑</span></div>
      </div>
      <span class="g-flag">🇦🇺</span>
    </div>
    <div class="gauge-sub"><span>대만 응원단</span><span>호주 응원단</span></div>
  </div>

  <!-- 정렬 탭 -->
  <div class="sort-bar">
    <span class="label">응원톡</span>
    <button class="sort-tab active" onclick="setSort('hot',this)">🔥 인기순</button>
    <button class="sort-tab" onclick="setSort('new',this)">최신순</button>
    <button class="sort-tab" onclick="setSort('controversial',this)">⚡ 논쟁중</button>
  </div>

  <!-- 응원글 피드 -->
  <div class="feed" id="feed"></div>

  <!-- 시뮬레이션 토글 -->
  <button class="sim" id="simBtn" onclick="toggleSim()" title="다른 유저 투표 시뮬레이션">🤖</button>

  <!-- 입력 바 -->
  <div class="input-bar">
    <div class="team-pick">
      <button id="pickTW" class="sel" onclick="pickTeam('TW')">🇹🇼</button>
      <button id="pickAU" class="aus" onclick="pickTeam('AU')">🇦🇺</button>
    </div>
    <input id="msgInput" placeholder="응원 메시지 입력..." onkeydown="if(event.key==='Enter')addComment()">
    <button class="send" onclick="addComment()">등록</button>
  </div>
</div>

<script>
let comments = [
  { id:1, nick:'두포리누나', team:'TW', karma:1240, gen:'♀ 3', text:'대만에 몰리네ㅋㅋ', up:24, down:3, myVote:0, ts:Date.now()-540000 },
  { id:2, nick:'들이받아버려', team:'TW', karma:380, gen:'♀ 3', text:'다시연승반등기대해봅니다', up:15, down:2, myVote:0, ts:Date.now()-480000 },
  { id:3, nick:'확실한삶z7', team:'AU', karma:2100, gen:'♀ 3', text:'언더 축잡고 가면된다', up:31, down:12, myVote:0, ts:Date.now()-420000 },
  { id:4, nick:'야맘마', team:'TW', karma:95, gen:'♀ 3', text:'마핸꽁짜ㅅㅅㅅㅅ', up:8, down:1, myVote:0, ts:Date.now()-300000 },
  { id:5, nick:'나온다입벌려', team:'TW', karma:670, gen:'♀ 3', text:'호주가 대만한테 비빌꺼같냐', up:19, down:18, myVote:0, ts:Date.now()-180000 },
  { id:6, nick:'캥거루펀치', team:'AU', karma:450, gen:'♂ 5', text:'호주 타선 요즘 물올랐다 두고봐라', up:12, down:9, myVote:0, ts:Date.now()-120000 },
];
let nextId = 7, sortMode = 'hot', myTeam = 'TW', simOn = true;
let prevRank = {};   // 순위 변동 추적
const BASE_TW = 5618, BASE_AU = 3207;

const flagOf = t => t==='TW' ? '🇹🇼' : '🇦🇺';
const karmaClass = k => k>=1000 ? 'lv3' : k>=300 ? 'lv2' : '';
const karmaLabel = k => (k>=1000?'👑 ':'') + k.toLocaleString();
const timeAgo = ts => { const m = Math.floor((Date.now()-ts)/60000); return m<1?'방금':m+'분 전'; };

function sorted() {
  const arr = [...comments];
  if (sortMode==='hot') arr.sort((a,b)=>(b.up-b.down)-(a.up-a.down));
  else if (sortMode==='new') arr.sort((a,b)=>b.ts-a.ts);
  else arr.sort((a,b)=>{ const c = x => Math.min(x.up,x.down)*(x.up+x.down); return c(b)-c(a); });
  return arr;
}

function render() {
  const feed = document.getElementById('feed');
  const oldPos = {};
  feed.querySelectorAll('.comment').forEach(el => oldPos[el.dataset.id] = el.getBoundingClientRect().top);

  const arr = sorted();
  const bestId = sortMode==='hot' && arr.length && (arr[0].up-arr[0].down)>0 ? arr[0].id : null;

  feed.innerHTML = arr.map((c,i) => {
    const score = c.up - c.down;
    const rank = i+1;
    const isHot = (c.up + c.down) >= 30;
    // 순위 변동 화살표
    let delta = '';
    if (sortMode==='hot' && prevRank[c.id] !== undefined) {
      const d = prevRank[c.id] - rank;
      delta = d>0 ? `<span class="rank-delta up">▲${d}</span>` : d<0 ? `<span class="rank-delta down">▼${-d}</span>` : `<span class="rank-delta same">-</span>`;
    }
    const rankCls = rank===1?'r1':rank===2?'r2':rank===3?'r3':'';
    return `<div class="comment ${c.id===bestId?'best':''}" data-id="${c.id}">
      <div class="rank-col">
        <div class="rank-num ${rankCls}">${sortMode==='hot' ? rank : ''}</div>
        ${sortMode==='hot' ? delta : ''}
      </div>
      <div class="avatar-c ${c.team==='AU'?'au':''}">👤</div>
      <div class="c-body">
        <div class="c-meta">
          <span class="flag">${flagOf(c.team)}</span>
          <span class="nick">${c.nick}</span>
          <span class="gen">${c.gen}</span>
          <span class="karma ${karmaClass(c.karma)}">${karmaLabel(c.karma)}</span>
          ${c.id===bestId?'<span class="best-tag">🏆 베스트</span>':''}
          ${isHot?'<span class="hot-tag">HOT</span>':''}
        </div>
        <div class="c-text">${c.text}</div>
        <div class="c-sub"><span>${timeAgo(c.ts)}</span><span class="u">▲ ${c.up}</span><span class="d">▼ ${c.down}</span></div>
      </div>
      <div class="vote-col">
        <button class="vote-btn up ${c.myVote===1?'on':''}" onclick="vote(${c.id},1)">▲</button>
        <div class="vote-score ${score>0?'pos':score<0?'neg':''}">${score}</div>
        <button class="vote-btn down ${c.myVote===-1?'on':''}" onclick="vote(${c.id},-1)">▼</button>
      </div>
    </div>`;
  }).join('');

  // 현재 순위 저장 (인기순 기준)
  if (sortMode==='hot') { prevRank = {}; arr.forEach((c,i)=>prevRank[c.id]=i+1); }

  // FLIP 애니메이션
  feed.querySelectorAll('.comment').forEach(el => {
    const id = el.dataset.id;
    if (oldPos[id] !== undefined) {
      const dy = oldPos[id] - el.getBoundingClientRect().top;
      if (dy) {
        el.style.transition = 'none';
        el.style.transform = `translateY(${dy}px)`;
        el.classList.add('moving');
        requestAnimationFrame(() => {
          el.style.transition = '';
          el.style.transform = '';
          setTimeout(()=>el.classList.remove('moving'), 500);
        });
      }
    }
  });
  updateBattle();
}

function vote(id, dir) {
  const c = comments.find(x=>x.id===id);
  if (!c) return;
  const prev = c.myVote;
  if (prev === dir) { c.myVote = 0; dir===1 ? c.up-- : c.down--; }
  else {
    if (prev===1) c.up--;
    if (prev===-1) c.down--;
    c.myVote = dir;
    dir===1 ? c.up++ : c.down++;
  }
  render();
}

function updateBattle() {
  let tw=0, au=0;
  comments.forEach(c => { c.team==='TW' ? tw+=c.up : au+=c.up; });
  tw += BASE_TW; au += BASE_AU;
  const pct = Math.max(28, Math.min(72, tw/(tw+au)*100));
  document.getElementById('barL').style.width = pct+'%';
  const nL = document.getElementById('numL'), nR = document.getElementById('numR');
  if (nL.textContent !== tw.toLocaleString()) { nL.classList.remove('pulse'); void nL.offsetWidth; nL.classList.add('pulse'); }
  if (nR.textContent !== au.toLocaleString()) { nR.classList.remove('pulse'); void nR.offsetWidth; nR.classList.add('pulse'); }
  nL.textContent = tw.toLocaleString();
  nR.textContent = au.toLocaleString();
  document.getElementById('crownL').style.display = tw>=au ? '' : 'none';
  document.getElementById('crownR').style.display = au>tw ? '' : 'none';
}

function setSort(mode, btn) {
  sortMode = mode;
  document.querySelectorAll('.sort-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function pickTeam(t) {
  myTeam = t;
  document.getElementById('pickTW').classList.toggle('sel', t==='TW');
  document.getElementById('pickAU').classList.toggle('sel', t==='AU');
}

function addComment() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  comments.push({ id:nextId++, nick:'손님(나)', team:myTeam, karma:12, gen:'', text, up:1, down:0, myVote:1, ts:Date.now() });
  input.value = '';
  render();
}

// 타 유저 투표 시뮬레이션 (인기 댓글에 표가 몰리는 경향)
function simulate() {
  if (!simOn || !comments.length) return;
  const weighted = comments.flatMap(c => Array(Math.max(1, c.up - c.down + 2)).fill(c));
  const c = weighted[Math.floor(Math.random()*weighted.length)];
  Math.random() < 0.78 ? c.up++ : c.down++;
  render();
}
setInterval(simulate, 1800);

function toggleSim() {
  simOn = !simOn;
  document.getElementById('simBtn').classList.toggle('off', !simOn);
}

render();
</script>
</body>
</html>
